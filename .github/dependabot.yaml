version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    assignees:
      - psachmann
    groups:
      avalonia:
        patterns:
          - Avalonia*
      microsoft:
        patterns:
          - Microsoft*
      tunit:
        patterns:
          - TUnit*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
    assignees:
      - psachmann
