name: Setup .NET
description: Install the pinned SDK, restore the NuGet cache, tools and packages

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet Packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', 'dotnet-tools.json') }}
        restore-keys: |
          nuget-${{ runner.os }}
          nuget

    - name: Restore Tools
      shell: bash
      run: dotnet tool restore

    - name: Restore Packages
      shell: bash
      run: dotnet restore
