name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'dotnet-tools.json'
      - '.editorconfig'
      - '.github/workflows/build.yaml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'dotnet-tools.json'
      - '.editorconfig'
      - '.github/workflows/build.yaml'
      - '.github/actions/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          filter: tree:0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Format
        id: csharpier
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Expose GitHub Actions Runtime
        uses: ./.github/actions/expose-actions-runtime

      - name: Test
        run: dotnet test --configuration Release --no-restore --no-build --results-directory ./coverage -- --coverage --coverage-output-format cobertura

      - name: Pack (package validation)
        run: dotnet pack --configuration Release --no-restore --no-build --output ./artifacts

      - name: Find coverage files
        id: coverage
        run: |
          FILES=$(find ./coverage -name "*.cobertura.xml" | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Upload Test Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.files }}
          fail_ci_if_error: true

  build-skipped:
    name: Build
    needs: [build]
    if: ${{ always() && needs.build.result == 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build skipped — no code changes."

